address.insert=INSERT INTO customer_addresses (customer_id, label, line1, line2, city, state, country, postal_code, is_default) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)

address.unset-default=UPDATE customer_addresses SET is_default = false WHERE customer_id = ?

address.update=UPDATE customer_addresses SET label = ?, line1 = ?, line2 = ?, city = ?, state = ?, country = ?, postal_code = ?, is_default = ? WHERE address_id = ? AND customer_id = ?

address.is-default=SELECT is_default FROM customer_addresses WHERE address_id = ?

address.count=SELECT COUNT(*) FROM customer_addresses WHERE customer_id = ?

address.delete=DELETE FROM customer_addresses WHERE address_id = ?

address.exists=SELECT COUNT(*) FROM customer_addresses WHERE address_id = ? AND customer_id = ?

address.find-by-customer-id=SELECT address_id, label, line1, line2, city, state, country, postal_code, is_default FROM customer_addresses WHERE customer_id = ?