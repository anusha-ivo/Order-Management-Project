customer.insert=INSERT INTO customers (name, email, phone) VALUES (?, ?, ?)

customer.update=UPDATE customers SET name = ?, email = ?, phone = ? WHERE customer_id = ?

customer.delete=DELETE FROM customers WHERE customer_id = ?

customer.exists-email=SELECT COUNT(*) FROM customers WHERE email = ?

customer.exists-phone=SELECT COUNT(*) FROM customers WHERE phone = ?

customer.exists-email-other=SELECT COUNT(*) FROM customers WHERE email = ? AND customer_id <> ?

customer.exists-phone-other=SELECT COUNT(*) FROM customers WHERE phone = ? AND customer_id <> ?

customer.exists-id=SELECT COUNT(*) FROM customers WHERE customer_id = ?

customer.find-by-id=SELECT customer_id, name, email, phone, created_at, updated_at FROM customers WHERE customer_id = ?
